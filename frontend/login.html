<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - AI Resume Checker</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="auth-page">

        <div class="auth-card">

            <h1>Welcome Back</h1>

            <p class="auth-subtitle">
                Login to continue analyzing your resumes
            </p>

            <form id="loginForm">

                <label for="loginEmail">
                    Email
                </label>

                <input
                    type="email"
                    id="loginEmail"
                    placeholder="Enter your email"
                    required
                >

                <label for="loginPassword">
                    Password
                </label>

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Enter your password"
                    required
                >

                <button
                    type="submit"
                    class="auth-btn"
                >
                    Login
                </button>

            </form>

            <p class="auth-switch">

                Don't have an account?

                <a href="signup.html">
                    Create account
                </a>

            </p>

        </div>

    </div>


    <!-- Notification -->

    <div
        id="notification"
        class="notification"
    >

        <div
            class="notification-icon"
            id="notificationIcon"
        >
            ✓
        </div>

        <div>

            <strong id="notificationTitle">
                Success
            </strong>

            <p id="notificationMessage"></p>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
